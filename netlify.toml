# Netlify configuration for StudyFlow.
#
# The site is plain HTML, CSS and JavaScript with no dependencies and no build
# step, so there is nothing to compile — Netlify just serves the files.
#
#   /       the marketing page
#   /app/   the StudyFlow app
#
# The app routes with the URL hash (#/dashboard, #/deadlines, …), which the
# browser never sends to the server. That means no SPA catch-all redirect is
# needed: every URL Netlify sees maps to a file that really exists.

# The one build step: write app/config.js and version.json from the
# environment. See scripts/write-config.js — it is the only way the Supabase
# project URL and anon key reach the browser without being committed, and the
# only way the live site can say which commit it is running.
[build]
  publish = "."
  command = "node scripts/write-config.js"

# Nothing here is fingerprinted, so a long cache would strand people on an old
# version after a deploy. Revalidating keeps updates immediate while still
# allowing 304s, which is the right trade for a site this small.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# The service worker must not be cached, or a deploy cannot replace it.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# The accounts backend. netlify/functions/api.mjs handles everything under
# /api/ — sign-up, login, recovery and the student's own diploma. Routing it
# here rather than relying on the function's own path config keeps one obvious
# place to look when a request 404s.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Nothing the accounts backend returns may ever be cached: it is all per
# account, and a cached response would be served to the next person.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# Icons and the social card are content-stable; a long cache is safe and makes
# repeat visits and link previews instant.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# version.json answers "which build is live?" — it must never be cached.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

# config.js carries the account backend's address and the build stamp, and is
# rewritten on every deploy, so a cached copy would point the app at an old
# configuration.
[[headers]]
  for = "/app/config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
